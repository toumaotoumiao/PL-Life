<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f2ec"><title>模组高级工具</title>
<style>
:root{
  --bg:#f3f3ef;
  --paper:#fbfbf8;
  --paper-strong:#ffffff;
  --paper-soft:#f6f6f2;
  --ink:#242a27;
  --ink-soft:#4e5954;
  --muted:#68726d;
  --line:#dcded8;
  --line-strong:#cbd0c9;
  --accent:#415c53;
  --accent-deep:#30483f;
  --accent-soft:#e8eeea;
  --gold:#f1ede3;
  --red:#935454;
  --red-soft:#faf1f0;
  --shadow-xs:0 1px 2px rgba(31,42,37,.04);
  --shadow-sm:0 8px 24px rgba(31,42,37,.055);
  --shadow-md:0 18px 52px rgba(31,42,37,.10);
  --radius-xs:8px;
  --radius-sm:11px;
  --radius-md:14px;
  --radius-lg:18px;
  --focus:0 0 0 3px rgba(65,92,83,.16);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f8f8f5 0,#f4f4f0 260px,var(--bg) 100%);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:var(--accent-deep);text-underline-offset:3px}
::selection{background:#dce6e0;color:#20342d}
[hidden]{display:none!important}

/* Layout / brand */
.app{max-width:1600px;margin:0 auto;padding:28px 30px 58px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:4px 4px 22px;border-bottom:1px solid rgba(208,212,205,.72)}
.brand{min-width:0}

.brand-copy{min-width:0}
.brand h1{margin:0;font-size:clamp(34px,2.35vw,42px);line-height:1.08;font-weight:790;letter-spacing:-.048em;color:#202724}
.sub{margin-top:7px;color:var(--muted);font-size:12px;letter-spacing:.018em}
.save-state{display:inline-flex;align-items:center;gap:6px;margin-top:9px;color:#7c8781;font-size:9px;line-height:1.2;white-space:nowrap}
.save-state:before{content:"";width:6px;height:6px;border-radius:50%;background:#7ea08e}

/* Buttons / controls */
.btn,.control,.filter-toggle,.sortbox,.sortdir,.float-btn,.icon,.x{transition:border-color .16s ease,background-color .16s ease,color .16s ease,box-shadow .16s ease,transform .16s ease}
.btn{min-height:40px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);color:var(--ink);padding:8px 13px;font-weight:680;box-shadow:inset 0 1px 0 rgba(255,255,255,.72),var(--shadow-xs)}
.btn:hover{border-color:#aebbb4;background:#fff}
.btn:active{transform:translateY(1px)}
.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(49,75,65,.14)}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.small{min-height:32px;padding:5px 9px;font-size:11px}
.btn.danger{border-color:#dfc6c4;background:#fffafa;color:var(--red)}
.btn.danger:hover{background:#fbefee;border-color:#cfaaa7}
.control{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--line-strong);border-radius:10px;outline:0;background:#fdfdfa;color:var(--ink);box-shadow:inset 0 1px 1px rgba(37,48,43,.025)}
.control:hover{border-color:#b8c2bc}
.control:focus{border-color:#7f998f;box-shadow:var(--focus);background:#fff}
textarea.control{min-height:82px;resize:vertical;line-height:1.68}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #4f7165;outline-offset:2px}

/* Compact usage note */
.notice{margin:18px 0 16px;border:1px solid var(--line);border-radius:var(--radius-md);background:rgba(251,251,248,.84);box-shadow:var(--shadow-xs);font-size:12px;line-height:1.72}
.notice-compact{padding:0;overflow:hidden}
.notice-compact>summary{min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;list-style:none;cursor:pointer;user-select:none}
.notice-compact>summary::-webkit-details-marker{display:none}
.notice-compact>summary>span:first-child{display:flex;align-items:baseline;gap:12px;min-width:0}
.notice-compact>summary b{font-size:13px;font-weight:760;letter-spacing:.01em}
.notice-compact small{font-size:10px;color:var(--muted);font-weight:500}
.notice-more{display:inline-flex;align-items:center;gap:6px;color:#68746f;font-size:10px;font-weight:650;white-space:nowrap}
.notice-more:after{content:"⌄";font-size:14px;transition:transform .18s ease}
.notice-compact[open] .notice-more:after{transform:rotate(180deg)}
.notice-body{padding:3px 14px 15px;border-top:1px solid #e7e9e4;color:#515b56;line-height:1.82}
.notice-body b{color:#313b36;font-size:12px}

/* Statistics: one composed information band */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:0 0 16px;border:1px solid var(--line);border-radius:16px;background:rgba(251,251,248,.90);box-shadow:var(--shadow-xs);overflow:hidden}
.stat{position:relative;min-width:0;padding:15px 18px 14px}
.stat+.stat:before{content:"";position:absolute;left:0;top:17%;height:66%;width:1px;background:#e1e3de}
.stat label{display:block;margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:640;letter-spacing:.04em}
.stat b{font-size:28px;line-height:1;font-weight:760;letter-spacing:-.035em;font-variant-numeric:tabular-nums;color:#232b27}
.stat small{margin-left:5px;color:#6f7973;font-size:10px;font-variant-numeric:tabular-nums}

/* Search, sorting and filter composition */
.filter-shell{position:sticky;top:0;z-index:20;margin:0 -4px 8px;padding:9px 4px 10px;background:rgba(243,243,239,.91);backdrop-filter:blur(18px) saturate(115%);border-bottom:1px solid rgba(209,213,206,.66)}
.filter-main{display:grid;grid-template-columns:minmax(320px,1fr) 112px minmax(205px,245px) 94px;gap:8px;align-items:center}
.search{position:relative;min-width:0}
.search input{padding-left:38px}
.search span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#83908a;font-size:17px;pointer-events:none}
.filter-search .control,.filter-toggle,.sortbox,.sortdir.compact{height:46px;min-height:46px}
.filter-toggle{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);color:#3d4944;font-weight:730;padding:0 12px}
.filter-toggle:hover{border-color:#aebbb4;background:#fff}
.filter-count{min-width:21px;height:21px;display:grid;place-items:center;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:9px;font-weight:780;font-variant-numeric:tabular-nums}
.filter-chev{font-size:13px;color:#6f7b76;transition:transform .18s ease}
.filter-toggle[aria-expanded="true"] .filter-chev{transform:rotate(180deg)}
.sortbox{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:9px;padding:0 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper)}
.sortlabel{font-size:9px;color:var(--muted);letter-spacing:.04em}
.sortselect{min-width:0;width:100%;border:0;outline:0;background:transparent;color:#38443f;font-weight:700;cursor:pointer}
.sortdir{min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);color:var(--accent-deep);font-weight:720;white-space:nowrap}
.sortdir:hover{border-color:#aebbb4;background:#fff}
.sortdir .arrow{font-size:15px;line-height:1}.sortdir .dirtext{font-size:10px}
.filter-panel{margin-top:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(251,251,248,.98);box-shadow:0 15px 42px rgba(38,49,44,.07);opacity:0;transform:translateY(-5px);transform-origin:top;transition:opacity .16s ease,transform .16s ease}
.filter-panel.open{opacity:1;transform:none}
.filter-section+.filter-section{margin-top:13px;padding-top:13px;border-top:1px solid #e7e9e4}
.filter-section-title{margin-bottom:9px;color:#3f4d46;font-size:11px;line-height:1.3;font-weight:800;letter-spacing:.01em}
.filter-grid{display:grid;gap:9px}.filter-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.filter-field{min-width:0}.filter-field>span{display:block;margin:0 0 5px 2px;color:#66726c;font-size:9px;font-weight:700}
.range-pair-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.range-block{display:block;min-width:0}
.range-title{display:block;margin:0 0 6px 2px;color:#66726c;font-size:9px;font-weight:700;white-space:nowrap}
.rangefilter.integrated{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);align-items:center;gap:6px;background:transparent;padding:0}
.rangefilter.integrated select{min-width:0;width:100%;height:42px;border:1px solid var(--line-strong);border-radius:10px;outline:0;background:#fdfdfa;color:#35423c;padding:8px 28px 8px 10px;font-size:10px;font-weight:620;cursor:pointer;text-align:center;transition:border-color .14s ease,background .14s ease,box-shadow .14s ease}
.rangefilter.integrated select:hover{border-color:#bcc8c0;background:#fff}
.rangefilter.integrated select:focus{border-color:#7f998f;background:#fff;box-shadow:var(--focus)}
.rangesep{display:grid;place-items:center;align-self:stretch;color:#6a7770;font-size:14px;line-height:1;font-weight:760;letter-spacing:.02em}
.filter-panel-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;padding-top:12px;border-top:1px dashed #dfe2dc;color:var(--muted);font-size:9px}
.clear-filter-btn,.clear-inline{min-height:30px;border:0;border-radius:8px;background:transparent;color:#5f7169;font-size:10px;font-weight:700;padding:5px 8px}
.clear-filter-btn:hover,.clear-inline:hover{background:#edf1ed}
.active-filter-row{display:flex;align-items:center;gap:8px;margin-top:8px;min-width:0}
.active-label{color:var(--muted);font-size:9px;white-space:nowrap}
.active-filter-chips{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.filter-chip{min-height:30px;border:1px solid #d6ded8;border-radius:999px;background:#f7f8f5;color:#56645e;font-size:9px;font-weight:640;padding:4px 9px}
.filter-chip:hover{background:#edf2ee;border-color:#c1cec6}.filter-chip b{margin-left:4px;font-size:11px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;min-width:0;min-height:280px;padding:18px;border:1px solid #dadeda;border-radius:15px;background:rgba(251,251,248,.97);box-shadow:0 2px 10px rgba(32,43,38,.025);overflow:hidden;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}

.card:focus-within{border-color:#b7c5bd;box-shadow:0 0 0 3px rgba(65,92,83,.08),var(--shadow-sm)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;min-width:0}
.card-head>div:first-child{min-width:0}
.title{font-size:19px;font-weight:760;line-height:1.28;letter-spacing:-.025em;overflow-wrap:anywhere}
.author{margin-top:5px;color:var(--muted);font-size:10px;line-height:1.45}
.link{display:inline-flex;align-items:center;min-height:26px;margin-top:4px;color:#50665d;font-size:10px;text-decoration:none;border-bottom:1px solid transparent}
.link:hover{border-color:#8ea297}
.score{min-width:54px;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-start;padding-top:1px;background:transparent;color:var(--muted)}
.score:before{content:var(--mt-i18n-score,"评分");margin-bottom:2px;font-size:8px;font-weight:650;letter-spacing:.08em;color:#8a938e}.score b{font-size:19px;line-height:1;font-weight:760;color:#334d43;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}
.tag{display:inline-flex;align-items:center;min-height:23px;padding:3px 7px;border:1px solid #e0e3dd;border-radius:7px;background:#f5f6f2;color:#626c67;font-size:9px;line-height:1.2}
.tag.role{background:#e9efea;border-color:#d8e2db;color:#53675d}.tag.intent{background:var(--gold)}
.run{margin-top:auto;padding-top:11px;border-top:1px solid #e7e9e4}
.runline{margin-bottom:5px;color:var(--muted);font-size:9px;font-weight:650;letter-spacing:.03em}
.thought{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;color:#4f5954;font-size:11px;line-height:1.72;overflow-wrap:anywhere}
.muted{color:var(--muted)!important}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px;padding-top:9px;border-top:1px solid #e8eae5;color:var(--muted);font-size:9px}
.foot>span:last-child{display:flex;align-items:center;justify-content:flex-end;gap:3px;flex-wrap:wrap}
.icon{min-height:30px;border:0;border-radius:7px;background:transparent;color:#69736e;padding:5px 8px}
.icon:hover{background:#eef1ed;color:#334a40}
.action-text{font-size:10px;font-weight:680;line-height:1}
.foot .action-text:first-child,.row-actions .action-text:first-child{background:#edf3ef;color:#3f5f53}
.foot .action-text:last-child,.row-actions .action-text:last-child{background:transparent;color:#334a40;box-shadow:inset 0 0 0 1px #dce2dc}
.action-text.delete{background:transparent!important;color:var(--red)!important}
.action-text.delete:hover{background:var(--red-soft)!important}

/* Table */
.table-shell{position:relative;min-width:0;margin:0 -1px}
.table-shell:before,.table-shell:after{content:"";position:absolute;top:0;bottom:0;width:22px;z-index:8;pointer-events:none;opacity:0;transition:opacity .18s ease}
.table-shell:before{left:0;background:linear-gradient(90deg,rgba(37,49,43,.10),transparent)}
.table-shell:after{right:0;background:linear-gradient(270deg,rgba(37,49,43,.10),transparent)}
.table-shell.can-left:before,.table-shell.can-right:after{opacity:1}
.tablewrap{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain;border:1px solid var(--line);border-radius:14px;background:var(--paper);scrollbar-width:thin;scrollbar-color:#c7cfca transparent;cursor:grab}
.tablewrap.dragging{cursor:grabbing;user-select:none}
table{width:100%;border-collapse:separate;border-spacing:0}
.data{min-width:1180px;font-size:10px}
.data th,.data td{padding:10px 11px;text-align:left;vertical-align:top;line-height:1.55}
.data th{position:sticky;top:0;z-index:4;background:#f1f3ef;color:#59635e;font-weight:730;white-space:nowrap;border-bottom:1px solid #dde1dc}
.data td{background:#fbfbf8;border-bottom:1px solid #eceee9}
.data tbody tr:nth-child(even) td{background:#fafaf6}
.data tbody tr:hover td{background:#f3f6f2}
.data th:first-child,.data td:first-child{position:sticky;left:0;z-index:5;min-width:146px;max-width:190px;box-shadow:1px 0 0 #e1e4df}
.data th:first-child{z-index:7;background:#edf1ed}.data td:first-child{background:#fbfbf8}.data tbody tr:nth-child(even) td:first-child{background:#f9faf6}.data tbody tr:hover td:first-child{background:#f1f5f1}
.data td:nth-child(11){min-width:260px;max-width:350px;white-space:normal}
.data .row-actions{min-width:180px;white-space:nowrap}
.row-actions{display:flex;align-items:center;gap:3px}
/* Empty state */
.empty{padding:58px 22px;border:1px solid #dfe2dc;border-radius:15px;background:rgba(251,251,248,.72);text-align:center;color:var(--muted)}
.empty h3{margin:0 0 7px;color:#303934;font-size:17px}.empty p{margin:0 auto 16px;max-width:560px;line-height:1.7}
.empty-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* Modal / sections */
.modal-bg{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(31,40,36,.48);backdrop-filter:blur(7px)}
.modal{width:min(1000px,100%);max-height:calc(100vh - 44px);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(211,216,209,.88);border-radius:19px;background:var(--paper);box-shadow:0 34px 100px rgba(28,39,34,.24)}
.modal.wide{width:min(1220px,100%)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:17px 20px;border-bottom:1px solid #e2e5df;background:rgba(251,251,248,.96)}
.mh h2{margin:0;font-size:18px;line-height:1.3;font-weight:760;letter-spacing:-.02em}.mh p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.55}
.x{width:40px;height:40px;flex:0 0 40px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:11px;background:var(--paper);color:#68736d;font-size:19px;line-height:1;box-shadow:var(--shadow-xs)}
.x:hover{background:#eef1ed;color:#34473f}
.mb{padding:18px 20px;overflow:auto;overscroll-behavior:contain}
.mf{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #e2e5df;background:#f9faf6}
.modal-foot-left{display:flex;align-items:center;gap:10px;min-width:0}
.settings-status{display:inline-flex;align-items:center;gap:7px;min-height:28px;color:var(--muted);font-size:10px;font-weight:650;line-height:1.35}
.settings-status:before{content:"";width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--muted-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--muted-2) 12%,transparent)}
.settings-status.dirty{color:var(--accent-ink)}
.settings-status.dirty:before{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 17%,transparent)}
.settings-status.synced{color:var(--muted-2)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* 通用横向滚动提示：第一次进入可横滑区域时短暂出现，滚动后立即消失。 */
.hscroll-float-hint{position:fixed;z-index:360;display:flex;align-items:center;gap:6px;max-width:150px;padding:7px 10px;border:1px solid color-mix(in srgb,var(--tooltip-ink) 14%,transparent);border-radius:999px;background:color-mix(in srgb,var(--tooltip-bg) 94%,transparent);color:var(--tooltip-ink);box-shadow:var(--shadow-sm);font-size:10px;font-weight:720;line-height:1;letter-spacing:.01em;pointer-events:none;opacity:0;transform:translate3d(8px,0,0) scale(.96);transition:opacity .18s ease,transform .18s ease;backdrop-filter:blur(10px)}
.hscroll-float-hint.show{opacity:.94;transform:translate3d(0,0,0) scale(1)}
.hscroll-float-hint .hscroll-icon{font-size:15px;line-height:1;animation:hscrollNudge 1.05s ease-in-out 2}
@keyframes hscrollNudge{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}

.sec{margin-bottom:12px;padding:14px;border:1px solid #e0e3dd;border-radius:12px;background:#fcfcfa}
/* Information hierarchy: section title → section note → field label → helper text */
.st{font-size:13px;line-height:1.35;font-weight:780;letter-spacing:0;color:#334039}
.sd{margin:4px 0 10px;color:#747d78;font-size:10px;line-height:1.58}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 13px}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.field.full{grid-column:1/-1}
.field label{display:block;margin-bottom:5px;color:#505d56;font-size:10px;font-weight:720}.hint{margin-top:4px;color:#858d88;font-size:9px;line-height:1.5}
.split{display:flex;align-items:center;justify-content:space-between;gap:12px}.inline{display:flex;gap:7px;flex-wrap:wrap}
.dangersec{border-color:#e1cecc;background:#fffafa}
.foldsec{padding:0;overflow:hidden}
.foldsec>summary{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;list-style:none;cursor:pointer;user-select:none;border-radius:12px}
.foldsec>summary::-webkit-details-marker,.runedit>summary::-webkit-details-marker{display:none}
.foldsec>summary .st{font-size:15px;line-height:1.25;font-weight:820;letter-spacing:-.01em;color:#26342e}
.foldsec>summary .sd{margin:5px 0 0!important;color:#77807b;font-size:10px;line-height:1.5;font-weight:450}
.foldsec>summary:hover{background:#f6f7f3}
.foldsec>summary:after{content:"⌄";flex:0 0 auto;color:#75807a;font-size:16px;font-weight:700;transition:transform .18s ease}
.foldsec[open]>summary{border-bottom:1px solid #dde2dc;border-radius:11px 11px 0 0;background:#f8f9f5}
.foldsec[open]>summary:after{transform:rotate(180deg)}
.foldsec>.secbody{padding:15px 16px 16px}
.checkline{display:flex;align-items:flex-start;gap:8px;color:#4e5954;font-size:11px;line-height:1.6}.checkline input{margin-top:3px}

/* Edit modal quick navigation */
.modal{position:relative}
.modal.has-edit-nav .mb{padding-right:124px;scroll-behavior:smooth}

/* =========================================================
   v24 · Desktop / Mobile interaction adaptation
   Desktop: information density + pointer efficiency
   Mobile: thumb reach + single-column reading + no side obstruction
   ========================================================= */

/* Wide desktop: keep information dense without stretching text excessively. */
@media(min-width:1400px){
  .app{padding-left:34px;padding-right:34px}
  .cards{gap:16px}
  .card{padding:19px}
  .filter-main{grid-template-columns:minmax(380px,1fr) 116px minmax(220px,260px) 96px}
  .modal.wide{width:min(1280px,calc(100vw - 64px))}
}

/* Tablet / small laptop: preserve two-column reading before switching to phone layout. */
@media(min-width:701px) and (max-width:1100px){
  .app{padding-left:18px;padding-right:18px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal.wide{width:min(1040px,calc(100vw - 28px))}
  .edit-quicknav{right:8px;width:78px}
}

/* Real mobile interaction model. */
@media(max-width:700px){
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .app{padding:14px 10px calc(36px + env(safe-area-inset-bottom))}

  /* Header: prioritize title, let auxiliary text wrap naturally. */
  .top{padding:0 2px 14px}
  .brand h1{font-size:clamp(24px,7.1vw,29px);line-height:1.12;letter-spacing:-.04em}
  .sub{max-width:92vw;font-size:10px;line-height:1.55}
  .save-state{white-space:normal}

  /* Instructions remain compact but comfortably tappable. */
  .notice-compact>summary{min-height:48px}
  .notice-more{font-size:10px;font-weight:700}

  /* Statistics become a deliberate swipe strip. */
  .stats{scroll-snap-type:x mandatory;overscroll-behavior-x:contain}
  .stat{scroll-snap-align:start}
  .stat:first-child{margin-left:0}
  .stat:last-child{margin-right:0}

  /* Search first; filter/sort are a compact second row. */
  .filter-shell{top:0;margin-left:-2px;margin-right:-2px;padding-left:2px;padding-right:2px}
  .filter-main{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 48px}
  .filter-search{grid-column:1/-1}
  .filter-search .control{font-size:16px} /* prevents iOS focus zoom */
  .filter-toggle,.sortbox,.sortdir.compact{min-width:0}
  .sortselect,.filter-panel .control,.rangefilter.integrated select{font-size:14px}
  .filter-panel{max-height:min(62dvh,520px);border-radius:14px}
  .filter-section-title{font-size:12px}
  .rangefilter.integrated select{padding-left:8px;padding-right:24px}

  /* Main archive cards: single-column, actions become true touch targets. */
  .cards{grid-template-columns:1fr}
  .card{padding:15px 14px 13px}
  .card-head{gap:9px}
  .title{font-size:18px}
  .author,.link{font-size:11px}
  .tags{gap:5px}
  .tag{min-height:27px;display:inline-flex;align-items:center;padding:4px 7px;font-size:9px}
  .foot{display:block;margin-top:11px}
  .foot>span:first-child{display:block;margin-bottom:8px}
  .foot>span:last-child{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;width:100%}
  .action-text{display:flex;align-items:center;justify-content:center;min-height:40px!important;padding:7px 4px!important;border:1px solid var(--line)!important;border-radius:9px!important;background:var(--paper-soft)!important;color:var(--ink-soft)!important;font-size:10px!important;font-weight:720!important;text-align:center}
  .action-text:hover{background:var(--hover)!important}
  .action-text.danger,.action-text[style*="red"]{border-color:var(--danger-line)!important;background:var(--danger-soft)!important;color:var(--danger)!important}
  .score{min-width:48px}

  /* Modal = bottom sheet; header/footer remain reachable while the body scrolls. */
  .modal-bg{align-items:flex-end;padding:0}
  .modal,.modal.wide{
    width:100%;
    max-height:94dvh;
    border-width:1px 0 0;
    border-radius:20px 20px 0 0;
  }
  .mh{flex:0 0 auto;padding:13px 14px 11px}
  .mh h2{font-size:18px}
  .mh p{font-size:10px}
  .mb{min-height:0;padding:12px 12px 14px}
  .mf{flex:0 0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .modal-foot-left{min-width:0;flex:1}
  .settings-status{font-size:9px;white-space:normal}
  .hscroll-float-hint{max-width:132px;padding:7px 9px;font-size:9px}

  .mf>.inline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px}
  .mf>.inline .btn{min-height:44px}
  .mf>.inline .btn.primary{min-width:104px}
  .x{width:44px;height:44px;flex-basis:44px}

  /* Editing form: no right-side rail on mobile.
     Quick navigation becomes a fixed-in-modal four-tab strip under the header. */
  .modal.has-edit-nav .mb{padding-right:12px}
  .edit-quicknav{
    position:relative;
    inset:auto;
    z-index:15;
    flex:0 0 auto;
    width:100%;
    transform:none;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:0;
    padding:5px 8px;
    border-width:0 0 1px;
    border-radius:0;
    background:var(--glass-strong);
    border-color:var(--line);
    box-shadow:none;
    backdrop-filter:blur(12px);
  }
  .edit-quicknav button{
    min-width:0;
    min-height:42px;
    padding:0 3px;
    border-radius:8px;
    font-size:10px;
  }
  .edit-quicknav .qfull{display:none}
  .edit-quicknav .qshort{display:inline}
  .edit-anchor{scroll-margin-top:6px}

  /* Forms become one reading column; controls use mobile-safe sizes. */
  .grid,.grid3,.criteria{grid-template-columns:1fr}
  .field label{font-size:11px}
  .control{min-height:44px;padding:10px 11px;font-size:16px}
  textarea.control{font-size:15px;line-height:1.6}
  .hint{font-size:10px}
  .foldsec>summary{min-height:58px;padding:13px 14px}
  .foldsec>summary .st{font-size:15px}
  .foldsec>.secbody{padding:13px}
  .sec{margin-bottom:10px}

  /* Ratings and run entries: vertical reading, larger controls. */
  .scorehead{align-items:stretch;flex-direction:column}
  .scorehead>div{min-width:0!important;width:100%}
  .scorehead>div:last-child{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    text-align:left!important;
  }
  .computed{font-size:24px}
  .crit{padding:10px}
  .crit-top{font-size:10px}
  .runedit{margin-top:8px}
  .reh{min-height:50px;padding:10px 11px;font-size:11px}
  
  .reb{padding:11px}

  /* Rating-system settings also become touch-first. */
  .sysh{grid-template-columns:minmax(0,1fr) auto;gap:7px}
  .sysh>*:nth-child(3){grid-column:1/-1}
  .critrow{grid-template-columns:minmax(0,1fr) 72px 38px;gap:6px}
  .critrow .desc{grid-column:1/-1;grid-row:2}
  .critrow .control{min-height:42px;font-size:13px}

  /* Excel mapping keeps source and destination visually paired. */
  .importtop{grid-template-columns:1fr}
  .mapping{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:8px}
  .mapping .arrow,.mapping .conf{display:none}
  .mapping>div:not(.maphead){overflow-wrap:anywhere}
  .mapsel{min-height:42px!important;font-size:13px!important}
  .preview{max-height:260px}

  /* Recruitment export: one column + thumb-sized actions. */
  .recruit-temp{grid-template-columns:1fr}
  .recruit-preview textarea{min-height:280px;font-size:13px}
  .recruit-actions{align-items:stretch;flex-direction:column}
  .recruit-actions .inline{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .recruit-actions .btn{min-height:44px}

  /* Global floating dock moves to the bottom on phones.
     This avoids covering cards and keeps all five actions in thumb reach. */
  .float-tools{
    left:max(8px,env(safe-area-inset-left));
    right:max(8px,env(safe-area-inset-right));
    bottom:max(8px,env(safe-area-inset-bottom));
    width:auto;
    flex-direction:row;
    justify-content:space-between;
    gap:3px;
    padding:5px;
    border-radius:16px;
    background:var(--glass-strong);
    border-color:var(--line);
    box-shadow:var(--dock-shadow);
  }
  .float-btn{
    flex:1 1 0;
    width:auto;
    min-width:44px;
    height:48px;
    border-radius:10px;
    font-size:17px;
  }
  .float-btn.float-primary{flex-grow:1.1}
  .float-btn[data-tip]:after{display:none}
  .toastz{
    left:10px;
    right:10px;
    bottom:calc(72px + env(safe-area-inset-bottom));
    align-items:stretch;
  }
  .toast{text-align:center}

  /* Horizontal table stays usable if the user explicitly switches to table view. */
  .table-shell{border-radius:12px}
  .tablewrap{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  .data th,.data td{padding:9px 9px;font-size:10px}
}

/* Extra-small phones: reduce secondary density, never reduce tap targets. */
@media(max-width:430px){
  .app{padding-left:8px;padding-right:8px}
  .brand h1{font-size:24px}
  .sub{font-size:9px}
  .stat{flex-basis:124px;min-width:124px}
  .filter-main{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 46px}
  .filter-panel{padding:10px}
  .filter-grid.three{grid-template-columns:1fr}
  .foot>span:last-child{grid-template-columns:repeat(2,minmax(0,1fr))}
  .action-text{min-height:42px!important}
  .recruit-actions .inline{grid-template-columns:1fr}
  .mapping{grid-template-columns:1fr}
  .mapping .maphead{display:none}
  .mapsel{margin-bottom:8px}
  .mf{gap:7px}
  .mf>.inline{grid-template-columns:1fr 1fr}
  .mf>.inline .btn{min-width:0}
}

/* Theme picker */
.theme-settings{background:var(--section-bg)!important;border-color:var(--line)!important}
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.theme-option{position:relative;display:block;min-width:0;cursor:pointer}
.theme-option>input{position:absolute;opacity:0;pointer-events:none}
.theme-card{display:block;min-height:126px;padding:10px;border:1px solid var(--line-strong);border-radius:12px;background:var(--paper);transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease,background .16s ease}
.theme-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.theme-option>input:checked + .theme-card{border-color:var(--accent);box-shadow:var(--focus);background:var(--paper-strong)}
.theme-option>input:focus-visible + .theme-card{outline:2px solid var(--focus-color);outline-offset:2px}
.theme-swatch{display:grid;grid-template-columns:1.45fr .8fr .8fr .8fr;gap:4px;height:34px;margin-bottom:9px;padding:4px;border-radius:9px;background:var(--paper-soft);border:1px solid var(--line)}
.theme-swatch i{display:block;border-radius:5px}
.theme-washi i:nth-child(1){background:#f3f2ec}.theme-washi i:nth-child(2){background:#fcfbf7}.theme-washi i:nth-child(3){background:#48685b}.theme-washi i:nth-child(4){background:#9b5652}
.theme-indigo i:nth-child(1){background:#eef2f4}.theme-indigo i:nth-child(2){background:#fbfcfd}.theme-indigo i:nth-child(3){background:#49677d}.theme-indigo i:nth-child(4){background:#738b9a}
.theme-night{background:#242823!important;border-color:#485148!important}.theme-night i:nth-child(1){background:#232722}.theme-night i:nth-child(2){background:#343a33}.theme-night i:nth-child(3){background:#91aa98}.theme-night i:nth-child(4){background:#d38d86}
.theme-tomato i:nth-child(1){background:#fbf4ef}.theme-tomato i:nth-child(2){background:#fffaf7}.theme-tomato i:nth-child(3){background:#cb5147}.theme-tomato i:nth-child(4){background:#6b8a52}
.theme-sakura i:nth-child(1){background:#f7f2f4}.theme-sakura i:nth-child(2){background:#fffafb}.theme-sakura i:nth-child(3){background:#a75f6f}.theme-sakura i:nth-child(4){background:#ebd5db}
.theme-iris i:nth-child(1){background:#f4f2f7}.theme-iris i:nth-child(2){background:#fcfafd}.theme-iris i:nth-child(3){background:#76658a}.theme-iris i:nth-child(4){background:#ded5e8}
.theme-card b{display:block;color:var(--ink-strong);font-size:12px;line-height:1.35}
.theme-card small{display:block;margin-top:4px;color:var(--muted);font-size:9px;line-height:1.55}

/* Complete semantic recoloring: every major surface/component follows the selected theme. */
html{background:var(--bg)}
body{background:linear-gradient(180deg,var(--bg-top) 0,var(--bg-mid) 260px,var(--bg) 100%);color:var(--ink)}
a,.link{color:var(--accent-ink)}
::selection{background:var(--selection);color:var(--selection-ink)}
.top{border-bottom-color:var(--line)}
.brand h1,.title,.empty h3,.mh h2{color:var(--ink-strong)}
.sub,.meta,.muted,.author,.runline,.stat label,.sortlabel,.active-label,.hint,.sd,.field label{color:var(--muted)}
.save-state{color:var(--muted-2)}.save-state:before{background:var(--success)}

.btn{border-color:var(--line-strong);background:var(--paper);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),var(--shadow-xs)}
.btn:hover{border-color:var(--accent);background:var(--paper-strong)}
.btn.primary,.float-btn.float-primary,.filter-count{border-color:var(--accent);background:var(--accent);color:var(--accent-on)}
.btn.primary:hover,.float-btn.float-primary:hover{border-color:var(--accent-deep);background:var(--accent-deep);color:var(--accent-on)}
.btn.danger{border-color:var(--danger-line)!important;background:var(--danger-soft)!important;color:var(--danger)!important}
.btn.danger:hover{background:var(--danger-hover)!important;border-color:var(--danger)!important}
.control{border-color:var(--line-strong);background:var(--field-bg);color:var(--ink);box-shadow:none}
.control:hover{border-color:var(--accent)}
.control:focus{border-color:var(--accent);background:var(--field-focus);box-shadow:var(--focus)}
.control::placeholder{color:var(--muted-2);opacity:1}
select.control,select.sortselect,.rangefilter.integrated select{color:var(--ink);background-color:var(--field-bg)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline-color:var(--focus-color)}

.notice,.stats,.card,.tablewrap,.empty{border-color:var(--line);background:var(--glass);box-shadow:var(--shadow-xs)}
.notice-body{border-top-color:var(--line);color:var(--ink-soft)}.notice-body b,.notice-compact>summary b{color:var(--ink-strong)}
.notice-more,.notice-compact small{color:var(--muted)}
.stat+.stat:before{background:var(--line)}.stat b{color:var(--ink-strong)}.stat small{color:var(--muted)}

.filter-shell{background:var(--toolbar-glass);border-bottom-color:var(--line)}
.filter-toggle,.sortbox,.sortdir.compact{border-color:var(--line-strong);background:var(--paper);color:var(--ink)}
.filter-toggle:hover,.sortdir:hover{border-color:var(--accent);background:var(--paper-strong)}
.filter-chev,.search span,.rangesep{color:var(--muted)}
.sortselect{color:var(--ink)}
.filter-panel{border-color:var(--line);background:var(--paper);box-shadow:var(--shadow-sm)}
.filter-section+.filter-section,.filter-panel-foot{border-color:var(--line)}
.filter-section-title{color:var(--ink-soft)}
.rangefilter.integrated select{border-color:var(--line-strong)}
.rangefilter.integrated select:hover,.rangefilter.integrated select:focus{border-color:var(--accent);background:var(--field-focus)}
.clear-filter-btn,.clear-inline{border-color:var(--line-strong);background:var(--paper-soft);color:var(--ink-soft)}
.clear-filter-btn:hover,.clear-inline:hover{border-color:var(--accent);background:var(--hover)}
.filter-chip{border-color:var(--line);background:var(--chip);color:var(--ink-soft)}.filter-chip:hover{background:var(--hover-strong)}

.card{border-color:var(--line);background:var(--glass-strong);box-shadow:var(--shadow-xs)}
.card:focus-within{border-color:var(--accent);box-shadow:var(--focus),var(--shadow-sm)}
@media (hover:hover) and (pointer:fine){.card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm)}}
.link:hover{border-color:var(--accent)}
.score,.score:before{color:var(--muted-2)}.score b{color:var(--accent-ink)}
.tag{border-color:var(--line);background:var(--chip);color:var(--ink-soft)}
.tag.role{border-color:var(--line);background:var(--chip-role);color:var(--accent-ink)}.tag.intent{background:var(--gold)}
.run,.foot{border-top-color:var(--line)}.thought{color:var(--ink-soft)}
.icon,.action-text{color:var(--ink-soft)}.icon:hover{background:var(--hover);color:var(--accent-ink)}
.foot .action-text:first-child,.row-actions .action-text:first-child{background:var(--accent-soft);color:var(--accent-ink)}
.foot .action-text:last-child,.row-actions .action-text:last-child{background:transparent;color:var(--ink-soft);box-shadow:inset 0 0 0 1px var(--line)}
.action-text.delete{color:var(--danger)!important}.action-text.delete:hover{background:var(--danger-soft)!important}

.table-shell:before{background:linear-gradient(90deg,color-mix(in srgb,var(--ink) 12%,transparent),transparent)}
.table-shell:after{background:linear-gradient(270deg,color-mix(in srgb,var(--ink) 12%,transparent),transparent)}
.tablewrap{scrollbar-color:var(--line-strong) transparent}
.data th{background:var(--paper-soft);color:var(--ink-soft);border-bottom-color:var(--line)}
.data td{background:var(--paper);border-bottom-color:var(--line)}
.data tbody tr:nth-child(even) td{background:var(--table-even)}.data tbody tr:hover td{background:var(--table-hover)}
.data th:first-child{background:var(--paper-soft)}.data td:first-child{background:var(--paper)}.data tbody tr:nth-child(even) td:first-child{background:var(--table-even)}.data tbody tr:hover td:first-child{background:var(--table-hover)}
.data th:first-child,.data td:first-child{box-shadow:1px 0 0 var(--line)}
.empty{color:var(--muted)}

.modal-bg,.recruit-layer{background:var(--overlay)}
.modal{border-color:var(--line);background:var(--paper);box-shadow:var(--modal-shadow)}
.mh{border-bottom-color:var(--line);background:var(--glass-strong)}.mh p{color:var(--muted)}
.x{color:var(--muted)}.x:hover{background:var(--hover);color:var(--ink-strong)}
.mf{border-top-color:var(--line);background:var(--paper-soft)}
.sec,.theme-settings{border-color:var(--line);background:var(--section-bg)}
.st,.foldsec>summary .st{color:var(--ink-strong)}.sd{color:var(--muted)}.foldsec>summary .sd{color:var(--muted)!important}.field label{color:var(--ink-soft)}.hint{color:var(--muted-2)}
.dangersec{border-color:var(--danger-line);background:var(--danger-soft)}
.foldsec>summary:hover{background:var(--hover)}.foldsec>summary:after{color:var(--muted)}
.foldsec[open]>summary{border-bottom-color:var(--line);background:var(--section-open)}
.checkline{color:var(--ink-soft)}

.edit-quicknav{border-color:var(--line);background:var(--glass-strong);box-shadow:var(--shadow-sm)}
.edit-quicknav button{color:var(--muted)}.edit-quicknav button:hover{background:var(--hover);color:var(--ink-strong)}
.edit-quicknav button.active{background:var(--accent-soft);color:var(--accent-ink)}.edit-quicknav button:focus-visible{outline-color:var(--focus-color)}

.scorebox{border-color:var(--line);background:var(--score-bg)}.computed{color:var(--accent-ink)}
.crit{border-color:var(--line);background:var(--paper)}.crit-top{color:var(--muted-2)}.crit-top b{color:var(--ink-soft)}
.runedit{border-color:var(--line);background:var(--paper)}.runedit>summary:after{color:var(--muted)}
.reh{background:var(--run-head);color:var(--ink-strong)}
.sys{border-color:var(--line);background:var(--paper)}.sysh{background:var(--paper-soft)}

.maphead{border-bottom-color:var(--line);color:var(--ink-soft)}.arrow{color:var(--muted)}
.conf{background:var(--chip);color:var(--muted)}.conf.hi{background:var(--accent-soft);color:var(--accent-ink)}.conf.mid{background:var(--gold);color:var(--ink-soft)}
.preview{border-color:var(--line);background:var(--paper)}.preview th{background:var(--paper-soft);color:var(--ink-soft)}.preview td{border-top-color:var(--line);color:var(--ink-soft)}

.recruit-box{border-color:var(--line);background:var(--paper);box-shadow:var(--modal-shadow)}
.recruit-head{border-bottom-color:var(--line);background:var(--glass-strong)}.recruit-head h3{color:var(--ink-strong)}.recruit-head p,.export-note{color:var(--muted)}
