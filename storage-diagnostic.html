<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>PL 本机存储诊断</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#22352c;background:#f5f7f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px}.page{width:min(760px,100%);margin:0 auto}.card{background:#fff;border:1px solid #dce3de;border-radius:18px;padding:20px;box-shadow:0 14px 38px #20392b12}.eyebrow{font-size:12px;color:#6f7d76;margin-bottom:5px}.title{font-size:24px;line-height:1.2;margin:0 0 8px}.copy{margin:0;color:#5f6c66;line-height:1.65}.notice{margin:16px 0;padding:12px 14px;border-radius:12px;background:#eef5f0;border:1px solid #d1e1d6;font-size:13px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.btn{appearance:none;border:1px solid #cfd8d2;background:#fff;color:#2b4537;border-radius:11px;min-height:42px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:#365f49;border-color:#365f49;color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.status{font-size:13px;color:#5f6c66}.result{white-space:pre-wrap;word-break:break-word;background:#f7f9f8;border:1px solid #dde4df;border-radius:12px;padding:14px;min-height:170px;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#33443b}.footer{margin-top:12px;font-size:12px;color:#7b8781}@media(max-width:520px){body{padding:12px}.card{padding:16px}.title{font-size:21px}.actions{display:grid;grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body>
<main class="page">
<section class="card">
<div class="eyebrow">PL收集梦想生活 · v8.1.12.303 · schema26</div>
<h1 class="title">本机存储诊断</h1>
<p class="copy">检查范围：IndexedDB 数据库版本、对象仓库与索引结构。检查过程使用只读方式，反馈内容不包含档案记录。</p>
<div class="notice"><strong>恢复失败时可运行此检查：</strong>反馈时复制下方“匿名诊断”。报告内容为数据库结构与运行状态。</div>
<div class="actions"><button class="btn primary" id="run" type="button">重新检查</button><button class="btn" id="copy" type="button">复制匿名诊断</button><button class="btn" id="back" type="button">返回 PL</button></div>
<div class="status" id="status" role="status" aria-live="polite">正在检查…</div>
<pre class="result" id="result">正在检查…</pre>
<div class="footer">隐私边界：只输出程序版本、运行环境类型、数据库版本、仓库名、主键结构和索引名；不枚举记录，不读取记录值。</div>
</section>
</main>
<script>
(()=>{'use strict';
const APP_VERSION='8.1.12.303',SCHEMA=26;
const isTest=/\/PL-Life-Test(?:\/|$)/i.test(location.pathname),prefix=isTest?'pl-life-test__':'';
const targets=[
 {label:'PC附件库',base:'tomato_pl_pc_media_v1',target:3},
 {label:'恢复点库',base:'tomato_trpg_recovery_v1',target:2},
 {label:'冗余副本库',base:'tomato_pl_primary_mirror_v1',target:1}
];
let last='';
const el=id=>document.getElementById(id);
function keyText(v){if(Array.isArray(v))return '['+v.join(',')+']';if(v===null)return 'out-of-line';return String(v);}
async function inspectExisting(name){
 return await new Promise(resolve=>{
  const req=indexedDB.open(name);let created=false,done=false;
  req.onupgradeneeded=()=>{created=true;try{req.transaction.abort();}catch(_){}}
  req.onerror=()=>{if(done)return;done=true;resolve(created?{missing:true}:{error:String(req.error?.name||'Error')});};
  req.onblocked=()=>{if(done)return;done=true;resolve({blocked:true});};
  req.onsuccess=()=>{
   if(done)return;done=true;
   const db=req.result;
   try{
    if(created){db.close();resolve({missing:true});return;}
    const stores=[];
    for(const name of Array.from(db.objectStoreNames||[])){
      try{
        const tx=db.transaction(name,'readonly'),store=tx.objectStore(name),indexes=[];
        for(const idxName of Array.from(store.indexNames||[])){
          const idx=store.index(idxName);indexes.push(`${idx.name}:${keyText(idx.keyPath)}${idx.unique?':unique':''}`);
        }
        stores.push(`${name}{key=${keyText(store.keyPath)},auto=${store.autoIncrement?'1':'0'},index=${indexes.length?indexes.join('|'):'无'}}`);
      }catch(err){stores.push(`${name}{结构读取失败:${String(err?.name||'Error')}}`);}
    }
    const out={version:Number(db.version)||0,stores};db.close();resolve(out);
   }catch(err){try{db.close();}catch(_){}resolve({error:String(err?.name||'Error')});}
  };
 });
}
async function run(){
 const status=el('status'),result=el('result'),copy=el('copy'),runBtn=el('run');
 runBtn.disabled=true;copy.disabled=true;status.textContent='正在只读检查数据库结构…';
 try{
  if(!('indexedDB' in window)){last=`PL收集梦想生活 · 匿名本机存储诊断\n程序版本：v${APP_VERSION}\n数据结构：schema${SCHEMA}\nIndexedDB：浏览器不支持`;result.textContent=last;status.textContent='当前浏览器不支持 IndexedDB。';return;}
  if(typeof indexedDB.databases!=='function'){
    last=[`PL收集梦想生活 · 匿名本机存储诊断`,`程序版本：v${APP_VERSION}`,`数据结构：schema${SCHEMA}`,`运行环境：${isTest?'测试站':'正式站'}`,'IndexedDB：浏览器未提供无侵入数据库枚举','当前浏览器未提供数据库枚举接口，检查在数据库打开前结束。'].join('\n');
    result.textContent=last;status.textContent='浏览器不支持无侵入数据库枚举，已停止，未修改数据。';return;
  }
  let list=[];try{list=await indexedDB.databases();}catch(err){throw new Error('数据库列表读取失败：'+String(err?.name||err));}
  const known=new Map((list||[]).filter(x=>x?.name).map(x=>[String(x.name),x]));
  const lines=[
    'PL收集梦想生活 · 匿名本机存储诊断',
    `程序版本：v${APP_VERSION}`,
    `数据结构：schema${SCHEMA}`,
    `运行环境：${isTest?'测试站':'正式站'}`,
    `数据库枚举：支持（共 ${known.size} 个；只检查 PL 目标库）`
  ];
  for(const t of targets){
    const name=prefix+t.base;
    const listed=known.get(name);
    if(!listed){lines.push(`${t.label}：未建立；目标 v${t.target}`);continue;}
    const info=await inspectExisting(name);
    if(info.blocked){lines.push(`${t.label}：被其他标签页占用；列表版本 v${listed.version??'未知'}；目标 v${t.target}`);continue;}
    if(info.error){lines.push(`${t.label}：结构读取失败 ${info.error}；列表版本 v${listed.version??'未知'}；目标 v${t.target}`);continue;}
    if(info.missing){lines.push(`${t.label}：枚举后未能只读打开；目标 v${t.target}`);continue;}
    lines.push(`${t.label}：v${info.version} → 目标 v${t.target}`);
    lines.push(`  仓库：${info.stores.length?info.stores.join('；'):'无'}`);
  }
  lines.push('隐私说明：未读取记录内容、未创建/升级/删除/写入数据库、未读取备份 ZIP。');
  last=lines.join('\n');result.textContent=last;status.textContent='检查完成。可以只复制这段匿名诊断。';copy.disabled=false;
 }catch(err){last=`PL收集梦想生活 · 匿名本机存储诊断\n程序版本：v${APP_VERSION}\n诊断异常：${String(err?.name||'Error')}: ${String(err?.message||err).slice(0,500)}\n隐私说明：未读取记录内容。`;result.textContent=last;status.textContent='诊断未完成。数据库结构保持检查前状态。';copy.disabled=false;}
 finally{runBtn.disabled=false;}
}
async function copy(){
 if(!last)return;
 try{await navigator.clipboard.writeText(last);el('status').textContent='匿名诊断已复制。';}
 catch(_){const ta=document.createElement('textarea');ta.value=last;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();el('status').textContent=ok?'匿名诊断已复制。':'自动复制失败，请长按下方文本手动复制。';}
}
el('run').addEventListener('click',run);el('copy').addEventListener('click',copy);el('back').addEventListener('click',()=>{location.href='./index.html';});run();
})();
</script>
</body>
</html>
