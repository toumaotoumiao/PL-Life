      - name: Install pinned test-only browser runner
        run: npm install --no-save --no-audit --no-fund --prefix .github/pl-ci playwright@1.55.0
      - name: Install Chromium and OS dependencies
        run: .github/pl-ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Prepare browser diagnostics directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pl-synthetic-report"
          printf 'Commit: %s\nWorkflow: %s\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW" > "$RUNNER_TEMP/pl-synthetic-report/run-context.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned visual-check runner
        run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Round156 full-page visual structural acceptance
        id: round156_browser
        continue-on-error: true
        shell: bash
        env:
          PL_SYNTHETIC_REPORT_DIR: ${{ runner.temp }}/pl-synthetic-report
        run: |
          set -o pipefail
          python .github/pl-ci/round156-visual-acceptance.py 2>&1 | tee "$RUNNER_TEMP/pl-synthetic-report/round156-visual-acceptance.log"
