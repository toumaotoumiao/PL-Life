name: PL synthetic browser regression
on:
  workflow_dispatch:
  push:
    paths:
      - '*.html'
      - '*.js'
      - '*.webmanifest'
      - 'site/**'
      - '.github/pl-ci/**'
      - '.github/workflows/pl-browser-synthetic.yml'
  pull_request:
    paths:
      - '*.html'
      - '*.js'
      - '*.webmanifest'
      - 'site/**'
      - '.github/pl-ci/**'
      - '.github/workflows/pl-browser-synthetic.yml'
permissions:
  contents: read
jobs:
  chromium-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check existing-data startup order before browser run
        run: node --test .github/pl-ci/round76-startup-status-order.test.cjs
      - name: Check table lifecycle and Log note compatibility
        run: node --test .github/pl-ci/round71-lifecycle-log-ux.test.cjs
      - name: Check Log-only notes, record filtering and failed-save UI recovery
        run: node --test .github/pl-ci/round72-log-status-regression.test.cjs
      - name: Check CoC7 blank editions, ambiguity handling and partial export
        run: node --test .github/pl-ci/round73-coc7-variant-fidelity.test.cjs
      - name: Check filled-card family layout, purposeful extraction and original-workbook export
        run: node --test .github/pl-ci/round74-filled-card-family-regression.test.cjs
      - name: Check WPS UTF-16 XML, formula-cache boundaries and exact background text
        run: node --test .github/pl-ci/round75-xml-formula-regression.test.cjs
      - name: Verify same-origin version probe respects restrictive CSP
        run: node --test .github/pl-ci/round77-csp-version-probe.test.cjs
      - name: Guard PC filter and mobile More against ambiguous selectors
        run: node --test .github/pl-ci/round79-pc-filter-reachability.test.cjs
      - name: Guard PNG exports and version-label consistency
        run: node --test .github/pl-ci/round81-png-export-compat.test.cjs
      - name: Guard current release version, showcase and cache contract
        run: node --test .github/pl-ci/round92-current-release-contract.test.cjs
      - name: Guard privacy preflight resume ordering and rerendered export targets
        run: node --test .github/pl-ci/round93-privacy-export-resume.test.cjs
      - name: Guard calendar 2.0 module labels and planner/statistics separation
        run: node --test .github/pl-ci/round94-calendar-separation.test.cjs
      - name: Guard recap 2.0 logs, integrated history and organizer export
        run: node --test .github/pl-ci/round95-recap2-contract.test.cjs
      - name: Guard PC and module archive-image export 2.0
        run: node --test .github/pl-ci/round96-pc-module-export2-contract.test.cjs
      - name: Guard public-name persistence and shared density 2.0
        run: node --test .github/pl-ci/round97-public-name-density-contract.test.cjs
      - name: Guard organizer free-lane layout, insertion and locks
